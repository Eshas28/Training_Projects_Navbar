
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Training Hub Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 3px 15px;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            min-height: 54px;
            background-color: #d2e9e7;
            
        }

       
        .logo img {
            width: 65px;
            height: auto;
            display: block;
        }

     
        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-links a {
            text-decoration: none;
            color: #39434b;
            font-size: 10px;
            white-space: nowrap;
        }

        .nav-links a:first-child {
            color: #ff5722;
        }

     
        .contact-btn {
            background-color: #ff641f;
            color: white;
            text-decoration: none;
            font-size: 10px;
            padding: 8px 15px;
            border-radius: 20px;
            white-space: nowrap;
        }

       
        
        
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <img src="https://tse2.mm.bing.net/th/id/OIP.CEfX36RhuMI3WOFb3pxXXAAAAA?r=0&pid=Api&h=220&P=0" alt="IT Training Hub Logo">
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Courses</a>
            <a href="#">Blogs</a>
            <a href="#">Placements</a>
            <a href="#">Internship</a>
            <a href="#">Gallery</a>
            <a href="#">Hire From Us</a>
        </div>

        <a href="#" class="contact-btn">Contact Us</a>

    </nav>

</body>
</html>
