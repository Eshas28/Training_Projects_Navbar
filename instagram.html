
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Footer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 11px;
        }

        .footer {
            background-color: #0c1011;
            color: #a8a8a8;
            text-align: center;
            padding: 15px 10px 10px;
            min-height: 42px;
            padding:30px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .footer-links a {
            color: #a8a8a8;
            text-decoration: none;
            font-size: 10px;
            white-space: nowrap;
        }

        .footer-links a:hover {
            color: white;
        }

        .footer-bottom {
            font-size: 8px;
            color: #a8a8a8;
        }

        .footer-bottom span {
            margin: 0 5px;
        }

        
    </style>
</head>

<body>

    <footer class="footer">

        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            <a href="#">Popular</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Meta AI</a>
            <a href="#">Muse</a>
            <a href="#">Threads</a>
            <a href="#">Contact Uploading & Non-Users</a>
            <a href="#">Meta Verified</a>
        </div>

        <div class="footer-bottom">
            English <span>⌄</span>
            © 2026 Instagram from Meta
        </div>

    </footer>

</body>
</html>
