<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navbar</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .nav-left {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgb(243, 246, 243);
            color: rgb(5, 6, 0);
            padding: 10px 20px;
            width: 100%;
            min-height: 75px;
        }

        .linkedin-section {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .linkedin-icon {
            font-size: 38px;
            color: #0a66c2;
            cursor: pointer;
        }

        .search {
            width: 150px;
            padding: 6px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 25px;
        }

        .icon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 5px;
            min-width: 50px;
            cursor: pointer;
            font-size: 14px;
        }

        .icon-btn i {
            font-size: 18px;
        }

        .icon-btn span {
            white-space: nowrap;
        }

        @media (max-width: 850px) {
            .nav-left {
                flex-wrap: wrap;
                gap: 15px;
            }

            .nav-right {
                gap: 18px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="nav-left">

        <div class="linkedin-section">
            <i class="fa-brands fa-linkedin linkedin-icon"
                title="LinkedIn"></i>

            <input class="search" type="text"
                name="search" placeholder="Search...">
        </div>

        <div class="nav-right">

            <div class="icon-btn" title="Home">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </div>

            <div class="icon-btn" title="My Network">
                <i class="fa-solid fa-user-group"></i>
                <span>Network</span>
            </div>

            <div class="icon-btn" title="Messaging">
                <i class="fa-regular fa-comment-dots"></i>
                <span>Message</span>
            </div>

            <div class="icon-btn" title="Jobs">
                <i class="fa-solid fa-briefcase"></i>
                <span>Jobs</span>
            </div>

            <div class="icon-btn" title="Notifications">
                <i class="fa-solid fa-bell"></i>
                <span>Notification</span>
            </div>

            <div class="icon-btn" title="Me">
                <i class="fa-solid fa-user-check"></i>
                <span>Me</span>
            </div>

            <div class="icon-btn" title="For Business">
                <i class="fa-solid fa-grip"></i>
                <span>Business</span>
            </div>

        </div>

    </div>

</body>
</html>
