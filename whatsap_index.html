<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" 
    crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .nav-left{
            display: flex;
            background-color: rgb(0, 6, 0);
            padding:30px;
            align-content: center;
            color: rgb(204, 235, 77);

            

        
            

        }
        .profile-name{
            display:flex;
            font-size: 15px;
            font-weight: 300;
            align-items: center;
            white-space: nowrap;
           
            
            

        }
        .profile-icon{

            display: flex;
            padding-left:50px;
            gap:8px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 42px;
            margin-right:auto ;
           


        }
        
        .nav-right{
            display:flex;
            margin-left: auto;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            gap:20px;
            width: 50px;
            height: 50px;
            font-size: 18px;
            
        }
       

        
         


        
    </style>
</head>

<body>

    <div class="nav-left">
        <div class="profile-icon" title="Profile">
            <i class="fa-regular fa-circle-user"></i>
            <span class="profile-name">Esha Survase(You)</span>
            
        </div>
        <div>
            <div class="nav-right">
            <div class="icon-btn" title="video-call">
                <i class="fa-solid fa-video"></i>
            </div>
            <div class="icon-btn" title="search">
                 <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="icon-btn" title="menu">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>

        </div>
    </div>

   

</body>

</html>
